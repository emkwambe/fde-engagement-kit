{{- if .Values.engagementConfig }}
# The engagement's config, so it can change without a new image. Mounted over engagements/<name>/engagement.yaml.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-engagement
  labels: {{- include "fde.labels" . | nindent 4 }}
data:
  engagement.yaml: |
{{ .Values.engagementConfig | indent 4 }}
---
{{- end }}
{{- if not .Values.existingSecret }}
# Demo secrets for kind. Real deployments create the Secret outside Helm (or from Secret Manager) and set existingSecret,
# so secret values never live in a values file or in Helm's release history.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "fde.secretName" . }}
  labels: {{- include "fde.labels" . | nindent 4 }}
type: Opaque
stringData:
  postgres-password: {{ .Values.secrets.postgresPassword | quote }}
  agent-ro-password: {{ .Values.secrets.agentRoPassword | quote }}
  erp-api-token: {{ .Values.secrets.erpApiToken | quote }}
  admin-token: {{ .Values.secrets.adminToken | quote }}
  openai-api-key: {{ .Values.secrets.openaiApiKey | quote }}
{{- end }}
