# The simulated legacy ERP. Its shipment export is baked into its image at build time (deploy/docker/mock-erp.Dockerfile),
# generated by the same seed code and seed number as the ETL data, so both sides agree.
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-mock-erp
  labels: {{- include "fde.labels" . | nindent 4 }}
spec:
  selector: { app: {{ .Release.Name }}-mock-erp }
  ports: [{ name: http, port: {{ .Values.mockErp.port }}, targetPort: {{ .Values.mockErp.port }} }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-mock-erp
  labels: {{- include "fde.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels: { app: {{ .Release.Name }}-mock-erp }
  template:
    metadata:
      labels: { app: {{ .Release.Name }}-mock-erp }
    spec:
      securityContext: {{- include "fde.podSecurity" . | nindent 8 }}
      containers:
        - name: mock-erp
          image: "{{ .Values.image.mockErp.repository }}:{{ .Values.image.mockErp.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: ERP_API_TOKEN
              valueFrom: { secretKeyRef: { name: {{ include "fde.secretName" . }}, key: erp-api-token } }
            - { name: ERP_TICKETS_FILE, value: /tmp/erp/tickets.json }
          ports: [{ containerPort: {{ .Values.mockErp.port }} }]
          readinessProbe:
            httpGet: { path: /health, port: {{ .Values.mockErp.port }} }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: {{ .Values.mockErp.port }} }
            periodSeconds: 20
          resources: {{- toYaml .Values.mockErp.resources | nindent 12 }}
          securityContext: {{- include "fde.containerSecurity" . | nindent 12 }}
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: tmp, emptyDir: {} }
