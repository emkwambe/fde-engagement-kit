engagement:
  name: demo-logistics
  customer: Northwind Logistics (fictional)
  description: Late-shipment inquiry copilot across policy docs, reporting DB, and legacy ERP.
  examples:
    - What SLA credit does a Gold customer get for a delivery that is 3 days late?
    - Where is shipment SHP-2207?
    - Open a credit ticket for ORD-1043 for the amount the policy allows.

llm:
  provider: openai
  model: ${LLM_MODEL}
  # temperature: 0          # optional; leave unset unless the model supports it (gpt-6-luna does not, DC-016)
  max_steps: 8
  # Engagement-owned prompt (Sprint 01). The text is byte-identical to the prompt that produced the agent-v1 eval
  # results (sha 537c08f4c028 in reports), so the label stays agent-v1. Change the text -> change the label.
  system_prompt: engagements/demo-logistics/prompts/agent-v1.txt
  prompt_version: agent-v1
  fake_script: engagements/demo-logistics/extensions/fake_agent.py   # FAKE_LLM=1 only

embeddings:
  provider: openai
  model: text-embedding-3-small
  dimensions: 1536

vector_store:
  backend: pgvector
  dsn: ${DATABASE_URL}

retrieval:
  top_k: 5
  hybrid: true
  chunk_size: 800
  chunk_overlap: 100
  min_score: 0.3      # tune per engagement with evals (Day 3)
  tool_description: "Search the customer's policy documents (SLA, credits, claims, escalation, ...). Returns passages with a 'ref' label; cite facts as [ref]."

sources:
  documents:
    - type: local
      path: engagements/demo-logistics/data/docs
      include: ["*.pdf", "*.md", "*.docx"]
  tables:
    - type: csv
      path: engagements/demo-logistics/data/tables   # customers, orders, shipments
      target_schema: ops            # tables created by deploy/sql/003 (Day 1, before schema_sql existed)
      seed_script: engagements/demo-logistics/extensions/seed.py
      tables:                       # load order: parents first
        - name: customers
          file: customers.csv
          key: customer_id
          columns:
            customer_id: {type: text}
            name: {type: text}
            tier: {type: enum, values: [Standard, Silver, Gold, Platinum]}
            region: {type: text}
            email: {type: text}
            phone: {type: text}
        - name: orders
          file: orders.csv
          key: order_id
          references: {customer_id: customers}
          columns:
            order_id: {type: text}
            customer_id: {type: text}
            created_at: {type: timestamp}
            promised_at: {type: timestamp}
            delivered_at: {type: timestamp, required: false}
            status: {type: text, lower: true, default: unknown}
            value_usd: {type: money}
        - name: shipments
          file: shipments.csv
          key: shipment_id
          references: {order_id: orders}
          columns:
            shipment_id: {type: text}
            order_id: {type: text}
            carrier: {type: text}
            origin: {type: text}
            destination: {type: text}
            last_scan_at: {type: timestamp, required: false}
            last_status: {type: text}

tools:
  sql:
    enabled: true
    dsn: ${AGENT_RO_DATABASE_URL}
    schema: ops
    tables: [customers, orders, shipments, sla_breaches]
    row_limit: 200
  openapi:
    - spec: services/mock-erp/openapi.yaml
      base_url: ${ERP_API_URL}
      auth: { type: bearer, token: "${ERP_API_TOKEN}" }
      include_operations: [getShipment, listShipments, createTicket, getTicket]
      require_approval: [POST, PUT, PATCH, DELETE]

guardrails:
  pii_redaction: [email, phone]
  injection_filter: true
  log_prompts: false
  blocked_answer: "I can't follow instructions that try to change my rules. I can help with orders, shipments, SLA credits and claims within my normal permissions."

evals:
  golden_set: engagements/demo-logistics/evals/golden.jsonl
  threshold: 0.85

deploy:
  target: gcp_cloud_run
  region: us-east1
