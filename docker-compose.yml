name: fde-kit

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: fde
      POSTGRES_PASSWORD: fde
      POSTGRES_DB: fde
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fde -d fde"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Day 1: the API runs on your machine with `uv run uvicorn core.api.main:app --reload`.
  # Day 4 adds api, mock-erp and ui containers here.

volumes:
  pgdata:
